name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npx --yes npm@11.15.0 ci
      - run: npx --yes npm@11.15.0 run check
      - run: npx --yes npm@11.15.0 test
      - run: npx --yes npm@11.15.0 run build
      - run: npx --yes npm@11.15.0 audit
